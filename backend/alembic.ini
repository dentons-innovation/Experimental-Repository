# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .

# Alembic uses the SYNC psycopg2 URL. The app uses asyncpg separately.
# Override with DATABASE_SYNC_URL env var in production.
sqlalchemy.url = postgresql+psycopg2://projectflow:projectflow@localhost:5432/projectflow

[post_write_hooks]
# Optionally run ruff format on generated migration files
# hooks = ruff_format
# ruff_format.type = console_scripts
# ruff_format.entrypoint = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
