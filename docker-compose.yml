version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: projectflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectflow}
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - projectflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: projectflow_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projectflow}:${POSTGRES_PASSWORD:-projectflow}@postgres:5432/${POSTGRES_DB:-projectflow}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-projectflow}:${POSTGRES_PASSWORD:-projectflow}@postgres:5432/${POSTGRES_DB:-projectflow}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - projectflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: projectflow_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    networks:
      - projectflow

volumes:
  postgres_data:

networks:
  projectflow:
    driver: bridge
