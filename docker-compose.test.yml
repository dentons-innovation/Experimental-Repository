version: "3.9"
# Separate compose file for CI integration tests.
# Brings up only PostgreSQL with a test database.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: projectflow_postgres_test
    environment:
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow
      POSTGRES_DB: projectflow_test
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init-test.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data  # in-memory for speed in CI
    networks:
      - projectflow-test

networks:
  projectflow-test:
    driver: bridge
